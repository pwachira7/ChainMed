name: Deploy ChainMed to Azure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build backend and frontend
        run: npm run build

      - name: Keep production dependencies
        run: npm prune --omit=dev

      - name: Assemble deployment package
        run: |
          mkdir -p deploy/backend deploy/frontend
          cp package.json deploy/package.json
          cp -a backend/dist deploy/backend/
          cp -a frontend/dist deploy/frontend/
          cp -a node_modules deploy/node_modules

      - uses: actions/upload-artifact@v4
        with:
          name: chainmed-webapp
          path: deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chainmed-webapp
          path: deploy

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: Chainmed
          package: deploy
